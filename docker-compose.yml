services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: payshield-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API: what our Python code talks to
      - "9001:9001"   # Web console: what you open in the browser
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data   # keeps your data when the container restarts
    restart: unless-stopped

volumes:
  minio-data: